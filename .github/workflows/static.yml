name: Build and Publish Tailwind CSS

on:
  push:
    branches:
      - main
    # Opcional: Descomenta las siguientes líneas si solo quieres que se ejecute 
    # cuando cambien archivos relevantes, ahorrando minutos de GitHub Actions.
    # paths:
    #   - 'src/css/**'
    #   - 'tailwind.config.js'
    #   - 'package.json'
    #   - 'pnpm-lock.yaml'

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    
    # CRÍTICO: Permite que GitHub Actions tenga permisos para hacer push al repositorio
    permissions:
      contents: write 

    steps:
      - name: 1. Checkout del repositorio
        uses: actions/checkout@v4
        with:
          # Es necesario para que la acción de auto-commit funcione correctamente
          fetch-depth: 0 

      - name: 2. Instalar Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'

      - name: 3. Instalar PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: 4. Instalar dependencias
        run: pnpm install

      - name: 5. Compilar Tailwind CSS
        run: pnpm build

      - name: 6. Hacer commit y push del CSS a main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(css): compilar output.css automáticamente [skip ci]"
          branch: main
          file_pattern: 'dist/css/output.css'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
